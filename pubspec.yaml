name: guardian_iot
description: Prototipo comunitario de asistencia preventiva con sensores móviles.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^7.1.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
